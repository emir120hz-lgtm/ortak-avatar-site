<style>
/* Layout: tam ekran sahne (video/resim/aurora) + ortada cam kart + sağdan açılan ayarlar çekmecesi.
   Tek, koyu bir görünüm; renkler ayarlardan değişir. */
:root{
  --bg:#07060b;
  --fg:#f3f1fa;
  --muted:#a09db3;
  --accent:#8b7cff;
  --accent2:#ff5fa2;
  --glass:rgba(18,16,28,.42);
  --line:rgba(255,255,255,.13);
  --blur:18px;
  --dim:.45;
  --font-display:'Unbounded','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* katmanlar */
#bg,#dim,#fx{position:fixed;left:0;top:0;width:100%;height:100%}
#bg{z-index:0;background:var(--bg);overflow:hidden}
#dim{z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,rgba(5,4,10,calc(var(--dim)*.55)),rgba(5,4,10,var(--dim)) 70%,rgba(5,4,10,calc(var(--dim) + .25)));
  transition:background .4s}
#fx{z-index:2;pointer-events:none}
#media{position:absolute;inset:0}
#media>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease;background-size:cover;background-position:center}
#media>.show{opacity:1}
.aurora{position:absolute;inset:0;transition:opacity 1s}
.aurora.off{opacity:0}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.aurora i:nth-child(1){background:var(--accent);left:-18vmax;top:-22vmax;animation:drift1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:var(--accent2);right:-24vmax;bottom:-26vmax;animation:drift2 27s ease-in-out infinite alternate;opacity:.4}
.aurora i:nth-child(3){background:#2a5cff;left:30%;top:35%;width:40vmax;height:40vmax;animation:drift3 31s ease-in-out infinite alternate;opacity:.3}
@keyframes drift1{to{transform:translate(28vmax,20vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-30vmax,-18vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(-18vmax,12vmax) scale(1.25)}}

/* sahne + kart */
.stage{position:fixed;left:0;top:0;width:100%;height:100%;z-index:3;overflow-y:auto;display:grid;place-items:center;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(80px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  perspective:1000px}
.card{
  --rx:0deg;--ry:0deg;--ty:28px;--sc:.97;--gx:50%;--gy:0%;
  position:relative;width:min(100%,420px);min-width:0;padding:32px 24px 24px;border-radius:30px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1px solid var(--line);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1);
  transform:translateY(var(--ty)) scale(var(--sc)) rotateX(var(--rx)) rotateY(var(--ry));
  opacity:0;filter:blur(8px);
  transition:opacity .9s ease,filter .9s ease;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;
  will-change:transform;
}
.card.in{opacity:1;filter:blur(0)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(260px circle at var(--gx) var(--gy),rgba(255,255,255,.14),transparent 60%);mix-blend-mode:soft-light}

.avatar{position:relative;width:var(--av,120px);height:var(--av,120px);flex:none;margin:10px 0 6px}
.ring{position:absolute;inset:-7.7%;border-radius:50%;background:#17161c;z-index:0}
.avatar.cring .ring{inset:-4px;background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent));animation:spin 7s linear infinite}
.ring::after{content:"";display:none;position:absolute;inset:3px;border-radius:50%;background:#0c0a14}
.avatar.cring .ring::after{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

.credit{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;font:600 12px/1 var(--font-body);letter-spacing:.04em;color:var(--muted);opacity:.85;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.wings{position:absolute;inset:0;pointer-events:none;z-index:0;transform-origin:50% 55%;
  transform:translateY(var(--wy,0px)) scale(var(--ws,1));opacity:var(--wop,1);
  filter:drop-shadow(0 0 var(--wglow,10px) color-mix(in srgb,var(--accent) 65%,transparent)) hue-rotate(var(--whue,0deg))}
.wing{position:absolute;will-change:transform}
.wing img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
.wing.mir img{transform:scaleX(-1)}
.avatar.nowing .wings{display:none}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));z-index:1}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face b{font-family:var(--font-display);font-size:40px;font-weight:700;color:#fff;text-transform:uppercase}

#name{margin:4px 0 0;max-width:100%;font-family:var(--font-display);font-weight:700;font-size:clamp(30px,9vw,42px);line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
#name[data-fx=shimmer]{background:linear-gradient(100deg,#fff 15%,var(--accent) 38%,var(--accent2) 62%,#fff 85%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:-260% 0}}
#name[data-fx=neon]{color:#fff;text-shadow:0 0 6px var(--accent),0 0 22px var(--accent),0 0 46px var(--accent2);animation:neon 5s infinite}
@keyframes neon{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.78}}
#name[data-fx=glitch]{color:#fff;position:relative}
#name[data-fx=glitch]::before,#name[data-fx=glitch]::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden}
#name[data-fx=glitch]::before{color:var(--accent2);transform:translateX(2px);clip-path:inset(0 0 55% 0);animation:gl1 3s infinite steps(1)}
#name[data-fx=glitch]::after{color:#5ff3ff;transform:translateX(-2px);clip-path:inset(55% 0 0 0);animation:gl2 3.4s infinite steps(1)}
@keyframes gl1{0%,86%,100%{clip-path:inset(0 0 55% 0);transform:translateX(2px)}88%{clip-path:inset(18% 0 42% 0);transform:translateX(6px)}93%{clip-path:inset(62% 0 8% 0);transform:translateX(-4px)}}
@keyframes gl2{0%,80%,100%{clip-path:inset(55% 0 0 0);transform:translateX(-2px)}83%{clip-path:inset(30% 0 35% 0);transform:translateX(-6px)}90%{clip-path:inset(5% 0 70% 0);transform:translateX(4px)}}

.bio{margin:0;min-height:1.5em;max-width:100%;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:3px;vertical-align:-.15em;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.idrow{display:flex;align-items:center;gap:10px;max-width:100%;min-width:0;padding:6px 6px 6px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
#did{font-family:var(--font-mono);font-size:12.5px;min-width:0;overflow-wrap:anywhere;user-select:all}
.icon-btn{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);transition:background .2s,transform .2s}
.icon-btn:hover{background:rgba(255,255,255,.16);transform:scale(1.06)}
.icon-btn svg{width:16px;height:16px}

.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.links a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;color:var(--fg);text-decoration:none;font-weight:600;font-size:14px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s,box-shadow .25s}
.links a:hover{transform:translateY(-3px);background:rgba(255,255,255,.14);border-color:var(--accent);box-shadow:0 10px 30px -10px var(--accent)}
.links a svg{width:17px;height:17px;flex:none}
.foot{display:flex;gap:10px;min-height:0}
.foot:empty{display:none}

/* ayar butonu */
#gear{position:fixed;z-index:6;left:calc(max(16px,env(safe-area-inset-left,0px)));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .4s cubic-bezier(.2,.8,.2,1),background .2s;opacity:.75}
#gear:hover{transform:rotate(60deg);opacity:1;background:rgba(255,255,255,.16)}
#gear svg{width:21px;height:21px}

/* ayar çekmecesi */
#panel{position:fixed;z-index:7;top:0;right:0;bottom:0;width:min(390px,100%);display:flex;flex-direction:column;
  background:rgba(14,12,22,.88);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border-left:1px solid var(--line);
  transform:translateX(104%);transition:transform .55s cubic-bezier(.2,.8,.2,1);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#panel.open{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px}
.ph h2{margin:0;font-family:var(--font-display);font-size:16px;font-weight:500}
.pb{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 28px;display:flex;flex-direction:column;gap:22px}
.grp{display:flex;flex-direction:column;gap:10px;min-width:0}
.grp>h3{margin:0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.row label{font-size:13.5px}
.row output{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:3ch;text-align:right}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
input[type=text],textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);font:inherit;font-size:14px}
textarea{resize:vertical;min-height:76px}
select option{background:#14111f;color:#f3f1fa}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:4px;border-radius:4px;background:rgba(255,255,255,.16);outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:0;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:0}
input[type=color]{width:42px;height:32px;padding:0;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.16);transition:background .25s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12.5px;transition:background .2s,border-color .2s}
.seg button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{position:relative;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:13.5px;font-weight:600;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.ghost{background:none;font-weight:400;color:var(--muted)}
.btn.danger.armed{background:#7a1f3a;border-color:#ff5f8a;color:#fff}
.btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.hint{margin:0;font-size:12px;color:var(--muted)}
.hint b{color:var(--fg);font-weight:600}

/* giriş ekranı */
#splash{position:fixed;inset:0;z-index:9;display:grid;place-items:center;border:0;color:var(--fg);
  background:rgba(5,4,10,.5);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  transition:opacity .8s ease,backdrop-filter .8s ease,-webkit-backdrop-filter .8s ease;cursor:pointer;text-align:center}
#splash.out{opacity:0;pointer-events:none;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}
#splash .sn{display:block;font-family:var(--font-display);font-weight:700;font-size:clamp(34px,11vw,64px);letter-spacing:-.01em;overflow-wrap:anywhere;padding:0 16px}
#splash .sh{display:block;margin-top:14px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

#toast{position:fixed;z-index:10;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:10px 18px;border-radius:999px;background:rgba(20,17,31,.92);border:1px solid var(--line);font-size:13.5px;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:520px){
  #panel{width:100%}
  .seg{grid-template-columns:repeat(3,1fr)}
  .card{padding:28px 18px 20px;border-radius:26px}
}
@media (prefers-reduced-motion:reduce){
  .aurora i,.ring,#name,#name::before,#name::after,.caret,#splash .sh{animation:none!important}
  *{transition-duration:.01s!important}
}
</style>

      <h3>Profil</h3>
      <div class="field"><label for="s-name">Ad</label><input type="text" id="s-name" maxlength="32" autocomplete="off"></div>
      <div class="field"><label for="s-fx">Ad efekti</label>
        <select id="s-fx"><option value="shimmer">Parıltı</option><option value="neon">Neon</option><option value="glitch">Glitch</option><option value="plain">Düz</option></select>
      </div>
      <div class="field"><label for="s-bio">Bio (her satır sırayla yazılır)</label><textarea id="s-bio" maxlength="240"></textarea></div>
      <div class="field"><label for="s-links">Bağlantılar (Etiket | https://adres)</label><textarea id="s-links" maxlength="600" placeholder="Instagram | https://instagram.com/..."></textarea></div>
      <div class="btns">
        <label class="btn">Avatar yükle<input type="file" id="f-av" accept="image/*"></label>
        <button class="btn ghost" type="button" id="rm-av">Kaldır</button>
      </div>
    </div>

    <div class="grp">
      <h3>Kanatlar</h3>
      <div class="row"><label for="c-wings">Kanatlar açık</label><span class="sw"><input type="checkbox" id="c-wings"><span></span></span></div>
      <div class="row"><label for="s-wsp">Çırpma hızı</label><input type="range" id="s-wsp" min="1" max="100"><output id="o-wsp"></output></div>
      <div class="row"><label for="s-wam">Çırpma genliği (°)</label><input type="range" id="s-wam" min="0" max="40"><output id="o-wam"></output></div>
      <div class="row"><label for="s-wsz">Kanat boyutu (%)</label><input type="range" id="s-wsz" min="50" max="160"><output id="o-wsz"></output></div>
      <div class="row"><label for="s-wsd">Kanat açıklığı (px)</label><input type="range" id="s-wsd" min="-30" max="40"><output id="o-wsd"></output></div>
      <div class="row"><label for="s-wy">Dikey konum (px)</label><input type="range" id="s-wy" min="-40" max="40"><output id="o-wy"></output></div>
      <div class="row"><label for="s-wgl">Parlama</label><input type="range" id="s-wgl" min="0" max="40"><output id="o-wgl"></output></div>
      <div class="row"><label for="s-whu">Kanat rengi (ton)</label><input type="range" id="s-whu" min="-180" max="180"><output id="o-whu"></output></div>
      <div class="row"><label for="s-wop">Opaklık (%)</label><input type="range" id="s-wop" min="10" max="100"><output id="o-wop"></output></div>
      <div class="row"><label for="s-avs">Avatar boyutu (px)</label><input type="range" id="s-avs" min="80" max="190"><output id="o-avs"></output></div>
      <div class="row"><label for="c-wring">Renkli dönen halka</label><span class="sw"><input type="checkbox" id="c-wring"><span></span></span></div>
      <div class="btns">
        <label class="btn">Kanat yükle<input type="file" id="f-wg" accept="image/*"></label>
        <button class="btn ghost" type="button" id="rm-wg">Varsayılan</button>
      </div>
      <p style="margin:6px 0 0;font-size:12px;color:var(--muted)">Kanat yüklersen sol kanat olarak alınır, sağ otomatik aynalanır.</p>
    </div>

    <div class="grp">
      <h3>Müzik</h3>
      <div class="btns">
        <label class="btn">Şarkı yükle<input type="file" id="f-mu" accept="audio/*"></label>
        <button class="btn ghost" type="button" id="rm-mu">Kaldır</button>
      </div>
      <div class="row"><label for="s-vol">Ses</label><input type="range" id="s-vol" min="0" max="100"><output id="o-vol"></output></div>
      <p class="hint">Müzik, giriş ekranında tıklanınca başlar.</p>
    </div>

    <div class="grp">
      <h3>Renk ve giriş</h3>
      <div class="row"><label for="s-ac">Ana renk</label><input type="color" id="s-ac"></div>
      <div class="row"><label for="s-ac2">İkinci renk</label><input type="color" id="s-ac2"></div>
      <div class="row"><label for="c-splash">Giriş ekranı</label><span class="sw"><input type="checkbox" id="c-splash"><span></span></span></div>
    </div>

    <div class="grp">
      <button class="btn danger" type="button" id="reset">Her şeyi sıfırla</button>
    </div>
  </div>
</aside>

<button id="splash" type="button" aria-label="Profile gir">
  <span><span class="sn" id="splashname">ds76s</span><span class="sh">girmek için tıkla</span></span>
</button>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  var DISCORD_ID='1493323179265884291';
  var KEY='ds76s:v1';
  var DEF={name:'ds76s',bio:'discord kullanıcısı\nsmooth olsun\nhep ileri',accent:'#8b7cff',accent2:'#ff5fa2',effect:'stars',intensity:60,blur:18,dim:45,tilt:true,trail:true,splash:true,nameFx:'shimmer',links:'',volume:50,wings:false,wSpeed:25,wAmp:14,wSize:100,wY:0,wSpread:0,wGlow:10,wHue:0,wOp:100,avSize:120,wRing:false};
  var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $=function(s){return document.querySelector(s)};
  var S=load();
  function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return Object.assign({},DEF)}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

  /* ---------- medya (IndexedDB, bu tarayıcıda kalır) ---------- */
  var mem={bg:null,av:null,mu:null,wg:null};
  var sharedAvatarUrl=null;
  var SHARED_AVATAR_API='/.netlify/functions/avatar';
  function loadSharedAvatar(){fetch(SHARED_AVATAR_API,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('no shared avatar');return r.blob()}).then(function(blob){if(!blob||!blob.size)return;if(sharedAvatarUrl)URL.revokeObjectURL(sharedAvatarUrl);sharedAvatarUrl=URL.createObjectURL(blob);applyAvatar()}).catch(function(){/* First deployment or no avatar saved yet */})}
  function saveSharedAvatar(file){return fetch(SHARED_AVATAR_API,{method:'PUT',headers:{'Content-Type':file.type||'image/png'},body:file}).then(function(r){if(!r.ok)throw new Error('Avatar kaydedilemedi');return r.json()})}
  function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('ds76s-media',1);r.onupgradeneeded=function(){r.result.createObjectStore('m')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
  function mGet(k){return idb().then(function(db){return new Promise(function(res){var q=db.transaction('m').objectStore('m').get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}})}).catch(function(){return null})}
  function mSet(k,v){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('m','readwrite');t.objectStore('m').put(v,k);t.oncomplete=res;t.onerror=res})}).catch(function(){})}
  function mDel(k){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('m','readwrite');t.objectStore('m').delete(k);t.oncomplete=res;t.onerror=res})}).catch(function(){})}

  /* ---------- yardımcılar ---------- */
  function rgb(h){var n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
  var toastT;
  function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('show')},2200)}

  /* ---------- arka plan ---------- */
  var mediaBox=$('#media'),aurora=$('#aurora');
  function applyBg(){
    var old=[].slice.call(mediaBox.children);
    if(!mem.bg){aurora.classList.remove('off');old.forEach(function(o){o.classList.remove('show');setTimeout(function(){o.remove()},1000)});return}
    var url=URL.createObjectURL(mem.bg),el;
    if((mem.bg.type||'').indexOf('video')===0){
      el=document.createElement('video');el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true;el.setAttribute('playsinline','');
      el.src=url;el.addEventListener('loadeddata',function(){show(el)});
      var p=el.play();if(p&&p.catch)p.catch(function(){});
    }else{
      el=document.createElement('div');el.style.backgroundImage='url("'+url+'")';
      var im=new Image();im.onload=function(){show(el)};im.src=url;
    }
    mediaBox.appendChild(el);
    function show(n){requestAnimationFrame(function(){n.classList.add('show');aurora.classList.add('off');old.forEach(function(o){o.classList.remove('show');setTimeout(function(){o.remove()},1000)})})}
  }

  /* ---------- avatar ---------- */
  function applyAvatar(){
    var img=$('#avimg'),b=$('#avletter');
    if(sharedAvatarUrl){img.src=sharedAvatarUrl;img.hidden=false;b.hidden=true}
    else if(mem.av){img.src=URL.createObjectURL(mem.av);img.hidden=false;b.hidden=true}
    else{img.src=DEF_AV;img.hidden=false;b.hidden=true}
  }

  /* ---------- müzik ---------- */
  var audio=new Audio();audio.loop=true;audio.preload='auto';
  var muted=false;
  var ICON_ON='<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>';
  var ICON_OFF='<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>';
  function applyMusic(){
    var btn=$('#mute');
    if(mem.mu){audio.src=URL.createObjectURL(mem.mu);btn.hidden=false}
    else{audio.pause();audio.removeAttribute('src');btn.hidden=true}
    audio.volume=S.volume/100;
    $('#muteico').innerHTML=muted?ICON_OFF:ICON_ON;
  }
  $('#mute').addEventListener('click',function(){
    muted=!muted;
    if(muted)audio.pause();else{var p=audio.play();if(p&&p.catch)p.catch(function(){})}
    $('#muteico').innerHTML=muted?ICON_OFF:ICON_ON;
  });

  /* ---------- profil ---------- */
  function applyProfile(){
    var nm=$('#name');
    nm.textContent=S.name||' ';nm.setAttribute('data-text',S.name||'');nm.setAttribute('data-fx',S.nameFx);
    $('#splashname').textContent=S.name;
    $('#avletter').textContent=(S.name||'?').charAt(0);
    document.title=S.name||'ds76s';
    $('#did').textContent=DISCORD_ID;
    renderLinks();startBio();
  }
  function renderLinks(){
    var box=$('#links');box.textContent='';
    var items=[{l:'Discord profili',u:'https://discord.com/users/'+DISCORD_ID,icon:true}];
    (S.links||'').split('\n').forEach(function(line){
      var i=line.indexOf('|');if(i<0)return;
      var l=line.slice(0,i).trim(),u=line.slice(i+1).trim();
      if(l&&/^https?:\/\//i.test(u))items.push({l:l,u:u});
    });
    items.slice(0,8).forEach(function(it){
      var a=document.createElement('a');a.href=it.u;a.target='_blank';a.rel='noopener noreferrer';
      if(it.icon)a.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
      a.appendChild(document.createTextNode(it.l));box.appendChild(a);
    });
  }
  var bioTok=0;
  function startBio(){
    var el=$('#biotext'),tok=++bioTok;
    var lines=(S.bio||'').split('\n').map(function(s){return s.trim()}).filter(Boolean);
    if(!lines.length){el.textContent='';return}
    if(RM||lines.length===1&&false){el.textContent=lines[0];return}
    var li=0,ci=0,del=false;
    (function tick(){
      if(tok!==bioTok)return;
      var s=lines[li%lines.length],wait;
      if(!del){ci++;el.textContent=s.slice(0,ci);wait=55+Math.random()*50;if(ci>=s.length){del=true;wait=lines.length>1?1900:3600000}}
      else{ci--;el.textContent=s.slice(0,ci);wait=22;if(ci<=0){del=false;li++;wait=350}}
      setTimeout(tick,wait);
    })();
  }

  /* ---------- görünüm değişkenleri ---------- */
  function applyVars(){
    var r=document.documentElement.style;
    r.setProperty('--accent',S.accent);r.setProperty('--accent2',S.accent2);
    r.setProperty('--blur',S.blur+'px');r.setProperty('--dim',(S.dim/100).toFixed(2));
  }

  /* ---------- efekt motoru ---------- */
  var cv=$('#fx'),cx=cv.getContext('2d'),W=0,H=0,P=[];
  function resize(){
    var d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);seed();
  }
  function seed(){
    var base={stars:150,snow:110,rain:170,embers:70}[S.effect]||0;
    var n=Math.round(base*S.intensity/60*Math.min(1.5,Math.sqrt(W*H/(1280*720)))*(RM?.4:1));
    P=[];
    for(var i=0;i<n;i++){
      var r=Math.random();
      if(S.effect==='stars')P.push({x:Math.random()*W,y:Math.random()*H,r:.4+r*1.3,tw:Math.random()*6.28,sp:.4+Math.random()*1.2,vx:(Math.random()-.5)*.06,c:i%9===0});
      else if(S.effect==='snow')P.push({x:Math.random()*W,y:Math.random()*H,r:1+r*2.4,vy:.35+r*.9,sw:Math.random()*6.28});
      else if(S.effect==='rain')P.push({x:Math.random()*W,y:Math.random()*H,l:10+r*16,vy:10+r*9,vx:-2});
      else if(S.effect==='embers')P.push({x:Math.random()*W,y:Math.random()*H,r:.8+r*2.2,vy:.25+Math.random()*.8,sw:Math.random()*6.28,a:Math.random()*6.28});
    }
  }
  var trail=[],mouse={x:-99,y:-99,fine:false};
  window.addEventListener('pointermove',function(e){
    mouse.fine=e.pointerType==='mouse';
    if(S.trail&&mouse.fine&&!RM){trail.push({x:e.clientX,y:e.clientY,l:1});if(trail.length>46)trail.shift()}
    tiltMove(e);
  },{passive:true});
  var last=performance.now();
  function frame(now){
    var dt=Math.min(now-last,50);last=now;var k=dt/16.67;
    cx.clearRect(0,0,W,H);
    var c=rgb(S.accent),i,p;
    if(S.effect==='stars'){
      for(i=0;i<P.length;i++){p=P[i];p.tw+=.02*p.sp*k;p.x+=p.vx*k;if(p.x<0)p.x=W;else if(p.x>W)p.x=0;
        var a=.3+.7*Math.abs(Math.sin(p.tw));
        cx.fillStyle=p.c?'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')':'rgba(255,255,255,'+a+')';
        cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
    }else if(S.effect==='snow'){
      cx.fillStyle='rgba(255,255,255,.85)';
      for(i=0;i<P.length;i++){p=P[i];p.y+=p.vy*k;p.sw+=.012*k;p.x+=Math.sin(p.sw)*.45*k;
        if(p.y>H+5){p.y=-5;p.x=Math.random()*W}
        cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
    }else if(S.effect==='rain'){
      cx.strokeStyle='rgba(190,205,255,.38)';cx.lineWidth=1;cx.beginPath();
      for(i=0;i<P.length;i++){p=P[i];p.y+=p.vy*k;p.x+=p.vx*k;
        if(p.y>H+20){p.y=-20;p.x=Math.random()*(W+60)}
        cx.moveTo(p.x,p.y);cx.lineTo(p.x+p.vx*1.4,p.y+p.l)}
      cx.stroke();
    }else if(S.effect==='embers'){
      cx.globalCompositeOperation='lighter';
      for(i=0;i<P.length;i++){p=P[i];p.y-=p.vy*k;p.sw+=.02*k;p.a+=.05*k;p.x+=Math.sin(p.sw)*.55*k;
        if(p.y<-10){p.y=H+10;p.x=Math.random()*W}
        var f=.45+.55*Math.abs(Math.sin(p.a));
        cx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(.16*f)+')';cx.beginPath();cx.arc(p.x,p.y,p.r*4,0,6.283);cx.fill();
        cx.fillStyle='rgba(255,235,220,'+(.9*f)+')';cx.beginPath();cx.arc(p.x,p.y,p.r*.8,0,6.283);cx.fill()}
      cx.globalCompositeOperation='source-over';
    }
    if(trail.length){
      cx.globalCompositeOperation='lighter';
      for(i=trail.length-1;i>=0;i--){var t=trail[i];t.l-=.035*k;
        if(t.l<=0){trail.splice(i,1);continue}
        cx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(t.l*.45)+')';cx.beginPath();cx.arc(t.x,t.y,4+10*t.l,0,6.283);cx.fill()}
      cx.globalCompositeOperation='source-over';
    }
    tiltStep(k);wingStep(dt);
    requestAnimationFrame(frame);
  }

  /* ---------- kart eğilmesi ---------- */
  var card=$('#card'),T={rx:0,ry:0,ty:28,sc:.97,trx:0,try_:0,tty:28,tsc:.97};
  function tiltMove(e){
    if(!S.tilt||RM||e.pointerType!=='mouse'){T.trx=0;T.try_=0;return}
    T.try_=(e.clientX/W-.5)*14;T.trx=-(e.clientY/H-.5)*11;
    var b=card.getBoundingClientRect();
    card.style.setProperty('--gx',(e.clientX-b.left)+'px');card.style.setProperty('--gy',(e.clientY-b.top)+'px');
  }
  document.documentElement.addEventListener('pointerleave',function(){T.trx=0;T.try_=0});
  function tiltStep(k){
    var f=1-Math.pow(.9,k);
    T.rx+=(T.trx-T.rx)*f;T.ry+=(T.try_-T.ry)*f;T.ty+=(T.tty-T.ty)*f;T.sc+=(T.tsc-T.sc)*f;
    if(Math.abs(T.ty)<.02&&T.tty===0)T.ty=0;
    var s=card.style;
    s.setProperty('--rx',T.rx.toFixed(3)+'deg');s.setProperty('--ry',T.ry.toFixed(3)+'deg');
    s.setProperty('--ty',T.ty.toFixed(2)+'px');s.setProperty('--sc',T.sc.toFixed(4));
  }

  /* ---------- giriş ---------- */
  var entered=false,sp=$('#splash');
  function showCard(){card.classList.add('in');T.tty=0;T.tsc=1}
  function enter(){
    if(entered)return;entered=true;
    sp.classList.add('out');setTimeout(function(){sp.hidden=true},900);
    showCard();
    if(mem.mu&&!muted){var p=audio.play();if(p&&p.catch)p.catch(function(){})}
  }
  sp.addEventListener('click',enter);

  /* ---------- ayar paneli ---------- */
  var panel=$('#panel'),gear=$('#gear');
  function openPanel(o){
    panel.classList.toggle('open',o);panel.setAttribute('aria-hidden',o?'false':'true');
    if(o)panel.removeAttribute('inert');else panel.setAttribute('inert','');
    gear.setAttribute('aria-expanded',o?'true':'false');
    if(o)$('#close').focus();else gear.focus();
  }
  gear.addEventListener('click',function(){openPanel(!panel.classList.contains('open'))});
  $('#close').addEventListener('click',function(){openPanel(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&panel.classList.contains('open'))openPanel(false)});

  function syncPanel(){
    $('#s-name').value=S.name;$('#s-bio').value=S.bio;$('#s-links').value=S.links;$('#s-fx').value=S.nameFx;
    $('#s-ac').value=S.accent;$('#s-ac2').value=S.accent2;
    $('#c-trail').checked=S.trail;$('#c-tilt').checked=S.tilt;$('#c-splash').checked=S.splash;
    [['dim','dim'],['int','intensity'],['blur','blur'],['vol','volume']].forEach(function(m){$('#s-'+m[0]).value=S[m[1]];$('#o-'+m[0]).textContent=S[m[1]]});
    [].forEach.call(document.querySelectorAll('#seg-fx button'),function(b){b.setAttribute('aria-pressed',b.dataset.v===S.effect?'true':'false')});
  }
  function bindText(id,key,after){$(id).addEventListener('input',function(e){S[key]=e.target.value;save();after()})}
  bindText('#s-name','name',applyProfile);
  bindText('#s-bio','bio',startBio);
  bindText('#s-links','links',renderLinks);
  bindText('#s-fx','nameFx',applyProfile);
  bindText('#s-ac','accent',applyVars);
  bindText('#s-ac2','accent2',applyVars);
  function bindRange(id,out,key,after){$(id).addEventListener('input',function(e){S[key]=+e.target.value;$(out).textContent=S[key];save();after()})}
  bindRange('#s-dim','#o-dim','dim',applyVars);
  bindRange('#s-blur','#o-blur','blur',applyVars);
  bindRange('#s-int','#o-int','intensity',seed);
  bindRange('#s-vol','#o-vol','volume',function(){audio.volume=S.volume/100});
  function bindCheck(id,key,after){$(id).addEventListener('change',function(e){S[key]=e.target.checked;save();if(after)after()})}
  bindCheck('#c-trail','trail',function(){if(!S.trail)trail.length=0});
  bindCheck('#c-tilt','tilt',function(){if(!S.tilt){T.trx=0;T.try_=0}});
  bindCheck('#c-splash','splash');
  [].forEach.call(document.querySelectorAll('#seg-fx button'),function(b){
    b.addEventListener('click',function(){S.effect=b.dataset.v;save();syncPanel();seed()});
  });

  function bindFile(id,key,after,okType,label){
    $(id).addEventListener('change',function(e){
      var f=e.target.files&&e.target.files[0];e.target.value='';
      if(!f)return;
      if(!okType.test(f.type||'')){toast('Desteklenmeyen dosya türü');return}
      mem[key]=f;mSet(key,f);after();toast(label+' güncellendi');
    });
  }
  bindFile('#f-bg','bg',applyBg,/^(video|image)\//,'Arka plan');
  $('#f-av').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];e.target.value='';
    if(!f)return;
    if(!/^image\//.test(f.type||'')){toast('Desteklenmeyen dosya türü');return}
    if(f.size>3*1024*1024){toast('Avatar 3 MB veya daha küçük olmalı');return}
    saveSharedAvatar(f).then(function(){
      mem.av=f;mSet('av',f);
      if(sharedAvatarUrl)URL.revokeObjectURL(sharedAvatarUrl);
      sharedAvatarUrl=URL.createObjectURL(f);applyAvatar();toast('Ortak avatar kaydedildi! Herkes görebilir');
    }).catch(function(){toast('Kaydedilemedi. Netlify Functions/Blobs ayarını kontrol et');});
  });
  loadSharedAvatar();
